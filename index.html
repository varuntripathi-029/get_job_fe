<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HireSignal tracks Indian startups for hiring momentum — funding, expansion and leadership signals pulled from public sources."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>HireSignal — hiring intelligence for Indian startups</title>
    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("hiresignal:theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
